[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pdf-splitter"
version = "0.1.0"
description = "AI-powered PDF splitter that detects logical document boundaries in scanned and born-digital PDFs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Santosh Ray" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "anyio>=4.3",
    "httpx>=0.27",
    "litellm>=1.55",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "pypdf>=5.1",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "tenacity>=9.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "reportlab>=4.2",
    "ruff>=0.6",
]

[project.scripts]
pdf-splitter = "pdf_splitter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_splitter"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src/pdf_splitter/core", "src/pdf_splitter/providers"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
testpaths = ["tests"]
